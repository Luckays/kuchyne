<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Návrh našeho bytu. Interaktivní model a přehled vybavení po jednotlivých místnostech."><title>Náš byt · návrh po místnostech</title><style>__STYLE__</style></head>
<body><a class="skip" href="#workspace">Přejít k modelu</a>
<div id="apartment-doors-v20" class="app">
<aside class="sidebar"><a class="brand" href="#all"><span class="brand-mark">⌂</span><span>Náš byt<small>NÁVRH INTERIÉRU</small></span></a><p class="nav-label">Místnosti</p><nav id="rooms" aria-label="Místnosti bytu"></nav></aside>
<main id="workspace"><header class="page-head"><div><p class="eyebrow">DOMOV / <span id="breadcrumb">CELÝ BYT</span></p><h1 id="room-title">Celý byt</h1></div></header>
<div class="work-grid"><section class="viewer-card" aria-label="Model bytu"><div class="viewer-toolbar"><div class="segmented" aria-label="Pohled"><button id="view-3d" aria-pressed="true">3D pohled</button><button id="view-plan" aria-pressed="false">Půdorys</button></div><button id="reset-view" class="quiet">Obnovit pohled</button></div><div class="canvas-wrap"><canvas tabindex="0" role="img" aria-label="Interaktivní model bytu. Šipkami otáčejte, plus a minus přibližují."></canvas><div class="zoom-tools"><button id="zoom-in" aria-label="Přiblížit">+</button><button id="zoom-out" aria-label="Oddálit">−</button></div></div><div class="viewer-bottom"><span id="view-caption">Celý byt</span><span>Tažením otáčej · + / − přibližuj</span></div><p id="load-status" role="status">Načítám model…</p></section>
<aside class="layer-card" aria-labelledby="layers-title"><p class="eyebrow">OVLÁDÁNÍ MODELU</p><h2 id="layers-title">Vrstvy a zobrazení</h2><div class="quick-controls"><label><input data-cut type="checkbox" checked> Snížit stěny</label><label><input data-doors type="checkbox"> Otevřít dveře</label></div><details class="layer-section" open><summary>Vyzkoušet v modelu</summary><div id="room-options" class="options">
<label data-for="office"><input data-keyboard type="checkbox"> Keyboard místo gauče</label>
<label data-for="balcony"><input data-glazing type="checkbox"> Odsunout zasklení lodžie</label>
<label data-for="wardrobe"><input data-cleaning type="checkbox"> Otevřít skříň na vysavač</label>
<label data-for="wardrobe hall"><input data-laundry type="checkbox"> Vysunout koš na prádlo</label>
<label data-for="living"><input data-bins type="checkbox"> Vysunout koše pod dřezem</label>
<label data-for="living"><input data-open type="checkbox"> Otevřít myčku</label>
<label data-for="living"><input data-screen type="checkbox"> Stáhnout projekční plátno</label>
<label><input data-inspect type="checkbox"> Odkrýt čela skříní</label>
<label><input data-ceiling type="checkbox"> Zobrazit podhled</label>
<label data-for="living office children bedroom balcony"><input data-shutters type="checkbox"> Stáhnout venkovní rolety</label>
</div></details>
<details class="layer-section" id="technical" open><summary>Světla a technické rozvody</summary><div class="technical-fields"><label>Vrstva<select data-service-layer><option value="interior" selected>Interiér bez značek</option><option value="practical">Vybavení a detaily</option><option value="light">Světla</option><option value="socket">Zásuvky a vypínače</option><option value="electric">Elektrotrasy</option><option value="water">Voda a odpady</option><option value="hood">Odtah</option><option value="data">Data a klimatizace</option></select></label><label>Bod v této místnosti<select data-service-point aria-label="Bod instalace"></select></label></div><p data-service-detail class="small" aria-live="polite"></p><p data-service-legend class="small"></p><label class="check"><input type="checkbox" data-hvac> Ukázat potrubí klimatizace</label></details></aside></div>
<footer>Náš byt · dispoziční a materiálový návrh <span>Dub / sklo / kámen</span></footer>
</main></div><script>__RENDERER__</script><script>__APP__</script></body></html>
