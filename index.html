root.querySelector('[data-view="rear"]').onclick=()=>{az=1.90;el=-.25;zoom=1;focus='ceiling';ceiling.checked=true;draw();};
root.querySelector('[data-view="cinema"]').onclick=()=>{az=1.80;el=.30;zoom=1;focus='cinema';ceiling.checked=false;screen.checked=true;draw();};
root.querySelector('[data-view="corner"]').onclick=()=>{az=.65;el=.40;zoom=1;focus='corner';ceiling.checked=false;screen.checked=false;openDW.checked=false;draw();};
cut.onchange=draw;kitchen.onchange=draw;openDW.onchange=draw;ceiling.onchange=draw;screen.onchange=draw;
new ResizeObserver(draw).observe(canvas);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
draw();
})();
</script>
