<div id="room-sofa-shelves-revision">
  <div class="viz-row" style="justify-content:space-between;gap:12px">
    <span class="tabular-nums">Místnost · gauč, police a promítání</span>
    <div class="viz-row">
      <button type="button" class="btn" data-view="iso">3D pohled</button>
      <button type="button" class="btn" data-view="kitchen">Kuchyň</button>
      <button type="button" class="btn" data-view="rear">Podhled</button>
      <button type="button" class="btn" data-view="cinema">Promítání</button>
      <button type="button" class="btn" data-view="corner">Rohová skříňka</button>
      <button type="button" class="btn" data-view="plan">Půdorys</button>
    </div>
  </div>
  <canvas role="img" aria-label="Otáčivý model zařízené místnosti podle DXF: kuchyň s poloostrovem a luxferovým čelem, stůl se čtyřmi židlemi a rohová sedačka." style="display:block;width:100%;height:470px;touch-action:none;cursor:grab"></canvas>
  <div class="viz-row" style="justify-content:space-between;gap:12px">
    <label class="form-check"><input class="form-check-input" data-cut type="checkbox" checked><span class="form-check-label">Řez předními stěnami</span></label>
    <label class="form-check"><input class="form-check-input" data-kitchen type="checkbox" checked><span class="form-check-label">Nábytek a kuchyň</span></label>
  </div>
  <label class="form-check"><input class="form-check-input" data-open type="checkbox"><span class="form-check-label">Otevřít myčku — návrh 45 cm</span></label>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" data-ceiling type="checkbox"><span class="form-check-label">Zobrazit celý podhled</span></label>
    <label class="form-check"><input class="form-check-input" data-screen type="checkbox"><span class="form-check-label">Stáhnout plátno</span></label>
  </div>
  <span class="sr-only">Tažením model otáčíte, kolečkem přibližujete. Výšky parapetu a otvorů jsou pracovní předpoklad.</span>
</div>
<script>
(() => {
const root=document.getElementById('room-sofa-shelves-revision');
const model=__MODEL_JSON__;
const canvas=root.querySelector('canvas'), ctx=canvas.getContext('2d');
const cut=root.querySelector('[data-cut]'), kitchen=root.querySelector('[data-kitchen]'),openDW=root.querySelector('[data-open]');
const ceiling=root.querySelector('[data-ceiling]'),screen=root.querySelector('[data-screen]');
let az=-.70,el=.65,zoom=1,drag=null,focus=false;
const {width:W,depth:D,height:H}=model.room;
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const sideNormal={south:[0,-1,0],north:[0,1,0],west:[-1,0,0],east:[1,0,0]};
const faces=[[[0,1,5,4],[0,-1,0]],[[1,2,6,5],[1,0,0]],[[2,3,7,6],[0,1,0]],[[3,0,4,7],[-1,0,0]],[[4,5,6,7],[0,0,1]],[[3,2,1,0],[0,0,-1]]];
const meshTriangles=[];
function splitTri(v,n,color,group){meshTriangles.push({v,n,color,group});}
for(const m of model.meshes){for(const f of m.faces){const v=f.map(i=>m.vertices[i]);const a=v[1].map((x,k)=>x-v[0][k]),b=v[2].map((x,k)=>x-v[0][k]);let n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];const l=Math.hypot(...n);if(l<1e-10)continue;n=n.map(x=>x/l);splitTri(v,n,m.color,m.group);}}
function draw(){
 const css=getComputedStyle(root), fg=css.getPropertyValue('--foreground').trim()||'#232323',bg=css.getPropertyValue('--background').trim()||'#faf9f6', muted=css.getPropertyValue('--border').trim()||'#b8b8b3';
 const w=canvas.clientWidth,h=canvas.clientHeight,ratio=Math.min(2,Math.max(1.5,window.devicePixelRatio||1));
 if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
 const eye=[Math.cos(el)*Math.cos(az),Math.cos(el)*Math.sin(az),Math.sin(el)];
 const right=[-Math.sin(az),Math.cos(az),0],up=[-Math.sin(el)*Math.cos(az),-Math.sin(el)*Math.sin(az),Math.cos(el)];
 const center=focus==='cinema'?[4.80,1.65,1.25]:focus==='corner'?[3.25,.50,.80]:focus==='ceiling'?[3.35,.8,2.1]:focus?[2.52,.9,1.0]:[W/2,D/2,.65];
 const raw=p=>{const q=p.map((v,i)=>v-center[i]);return [dot(q,right),-dot(q,up),dot(q,eye)];};
 const bounds=[];for(const x of (focus==='cinema'?[3.65,5.98]:focus==='corner'?[2.7,4.0]:focus==='ceiling'?[2.55,3.95]:focus?[.88,3.88]:[-.5,W+.5]))for(const y of (focus==='cinema'?[-.15,3.55]:focus==='corner'?[-.05,1.35]:focus==='ceiling'?[-.05,1.8]:focus?[-.05,2.2]:[-.5,D+.5]))for(const z of (focus==='cinema'?[0,2.5]:focus==='corner'?[0,1.5]:focus==='ceiling'?[1.3,2.67]:focus?[0,2.67]:[-.1,H]))bounds.push(raw([x,y,z]));
 const x0=Math.min(...bounds.map(p=>p[0])),x1=Math.max(...bounds.map(p=>p[0])),y0=Math.min(...bounds.map(p=>p[1])),y1=Math.max(...bounds.map(p=>p[1]));
 const scale=Math.min((w-18)/(x1-x0),(h-20)/(y1-y0))*zoom;
 const project=p=>{const q=raw(p);return [w/2+(q[0]-(x0+x1)/2)*scale,h/2+(q[1]-(y0+y1)/2)*scale,q[2]];};
 const polys=[];
 for(const b of model.boxes){
   if(!kitchen.checked&&!['wall','floor','frame','glass'].includes(b.group))continue;
   if(b.group==='ceiling'&&!ceiling.checked)continue;
   if(!ceiling.checked&&['LuxeAir navrh tela','Platno zapustene pouzdro'].includes(b.name))continue;
   if(b.group==='screen'&&!screen.checked)continue;
   if(focus==='corner'&&b.min[2]>1.3)continue;
   if(focus==='cinema'&&b.max[0]<3.7)continue;
   if(focus==='ceiling'&&b.max[2]<1.3)continue;
   const a=b.min.slice(),c=b.max.slice();
   if(el>1.5&&b.group!=='floor'){c[2]=Math.min(c[2],1.2);if(c[2]<=a[2])continue;}
   if(cut.checked&&b.side&&dot(sideNormal[b.side],eye)>.03&&el<1.5){c[2]=Math.min(c[2],.35);if(c[2]<=a[2])continue;}
   const v=[[a[0],a[1],a[2]],[c[0],a[1],a[2]],[c[0],c[1],a[2]],[a[0],c[1],a[2]],[a[0],a[1],c[2]],[c[0],a[1],c[2]],[c[0],c[1],c[2]],[a[0],c[1],c[2]]];
   const opened=openDW.checked&&b.group==='dishwasher_door';
   if(opened){const [hx,hz]=model.dishwasher_hinge;for(const p of v){const dx=p[0]-hx,dz=p[2]-hz;p[0]=hx-dz;p[2]=hz+dx;}}
   for(const [indices,normal] of faces){
    const n=opened?[-normal[2],normal[1],normal[0]]:normal;
    if(dot(n,eye)<.00001)continue;
    const p0=v[indices[0]],p1=v[indices[1]],p3=v[indices[3]];
    const du=p1.map((x,i)=>x-p0[i]),dv=p3.map((x,i)=>x-p0[i]);
    const nu=1,nv=1;
    const pt=(u,t)=>project(p0.map((x,i)=>x+du[i]*u+dv[i]*t));
    for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
      const pts=[pt(i/nu,j/nv),pt((i+1)/nu,j/nv),pt((i+1)/nu,(j+1)/nv),pt(i/nu,(j+1)/nv)];
      polys.push({pts,depth:pts.reduce((s,p)=>s+p[2],0)/4,n,color:b.color});
    }
   }
 }
 if(kitchen.checked){for(const t of meshTriangles){
   if(focus==='cinema'&&Math.max(...t.v.map(p=>p[0]))<3.7)continue;
   if(focus==='corner'&&Math.min(...t.v.map(p=>p[2]))>1.3)continue;
   if(focus==='ceiling'&&Math.max(...t.v.map(p=>p[2]))<1.3)continue;
   if(el>1.5&&t.group==='hood')continue;
   if(dot(t.n,eye)<.00001)continue;
   const pts=t.v.map(project);polys.push({pts,depth:pts.reduce((s,p)=>s+p[2],0)/3,n:t.n,color:t.color});
 }}
 // Orthographic software rasterizer with a real depth buffer.
 const pw=canvas.width,ph=canvas.height;
 const raster=ctx.createImageData(pw,ph),pix=raster.data,zbuf=new Float32Array(pw*ph);zbuf.fill(-1e20);
 const edge=(a,b,x,y)=>(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);
 for(const p of polys){
   const shade=.80+.20*Math.max(0,p.n[2])+.07*Math.max(0,-p.n[1]);
   const rgb=[1,3,5].map(i=>Math.min(255,Math.round(parseInt(p.color.slice(i,i+2),16)*shade)));
   const pts=p.pts.map(q=>[q[0]*ratio,q[1]*ratio,q[2]]);
   for(let k=1;k<pts.length-1;k++){
     const a=pts[0],b=pts[k],c=pts[k+1],area=edge(a,b,c[0],c[1]);if(Math.abs(area)<1e-8)continue;
     const xlo=Math.max(0,Math.floor(Math.min(a[0],b[0],c[0]))),xhi=Math.min(pw-1,Math.ceil(Math.max(a[0],b[0],c[0])));
     const ylo=Math.max(0,Math.floor(Math.min(a[1],b[1],c[1]))),yhi=Math.min(ph-1,Math.ceil(Math.max(a[1],b[1],c[1])));
     for(let yy=ylo;yy<=yhi;yy++)for(let xx=xlo;xx<=xhi;xx++){
       const u=edge(b,c,xx+.5,yy+.5)/area,v=edge(c,a,xx+.5,yy+.5)/area,t=1-u-v;
       if(u<-.00001||v<-.00001||t<-.00001)continue;
       const z=u*a[2]+v*b[2]+t*c[2],i=yy*pw+xx;if(z<=zbuf[i]+.0000001)continue;
       zbuf[i]=z;const j=i*4;pix[j]=rgb[0];pix[j+1]=rgb[1];pix[j+2]=rgb[2];pix[j+3]=255;
     }
   }
 }
 ctx.putImageData(raster,0,0);
 function dimension(p,q,text){const a=project(p),b=project(q);ctx.strokeStyle=fg;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);const nx=-dy/len*4,ny=dx/len*4;for(const v of [a,b]){ctx.moveTo(v[0]-nx,v[1]-ny);ctx.lineTo(v[0]+nx,v[1]+ny);}ctx.stroke();const x=(a[0]+b[0])/2,y=(a[1]+b[1])/2;ctx.font='12px system-ui';const tw=ctx.measureText(text).width;ctx.fillStyle=bg;ctx.fillRect(x-tw/2-4,y-10,tw+8,19);ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(text,x,y+4);}
 if(el>1.5&&!focus){dimension([0,-.36,0],[W,-.36,0],'5,87 m');dimension([W+.43,0,0],[W+.43,D,0],'3,45 m');}
}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';});
canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag.x)*.008;el=Math.max(-.3,Math.min(1.57,el+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY};draw();});
const release=()=>{drag=null;canvas.style.cursor='grab';};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.8,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
root.querySelector('[data-view="iso"]').onclick=()=>{az=-.70;el=.65;zoom=1;focus=false;ceiling.checked=false;draw();};
root.querySelector('[data-view="plan"]').onclick=()=>{az=-Math.PI/2;el=Math.PI/2;zoom=1;focus=false;draw();};
root.querySelector('[data-view="kitchen"]').onclick=()=>{az=1.90;el=.50;zoom=1;focus=true;kitchen.checked=true;ceiling.checked=false;draw();};
root.querySelector('[data-view="rear"]').onclick=()=>{az=1.90;el=-.25;zoom=1;focus='ceiling';ceiling.checked=true;draw();};
root.querySelector('[data-view="cinema"]').onclick=()=>{az=1.80;el=.30;zoom=1;focus='cinema';ceiling.checked=false;screen.checked=true;draw();};
root.querySelector('[data-view="corner"]').onclick=()=>{az=.65;el=.40;zoom=1;focus='corner';ceiling.checked=false;screen.checked=false;openDW.checked=false;draw();};
cut.onchange=draw;kitchen.onchange=draw;openDW.onchange=draw;ceiling.onchange=draw;screen.onchange=draw;
new ResizeObserver(draw).observe(canvas);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
draw();
})();
</script>
